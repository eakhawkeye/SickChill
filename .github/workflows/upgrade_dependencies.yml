name: "Upgrade poetry and yarn dependencies"
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  depends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "master"
          token: ${{ github.token }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependency tools
        run: python -m pip install --upgrade pip "poetry==1.8.5" "packaging<25"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install yarn
        run: npm install -g yarn@1.22.22
      - name: Upgrade dependencies
        run: |
          poetry update
          yarn upgrade
      - if: success() && !env.ACT
        name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update poetry (python) and yarn (npm) dependencies
          commit_options: "--no-verify --signoff"

          file_pattern: package.json yarn.lock pyproject.toml

          # Optional commit user and author settings
          commit_user_name: miigotu
          commit_user_email: miigotu@gmail.com
          commit_author: miigotu <miigotu@gmail.com>

          disable_globbing: true
          # skip_fetch: true
          add_options: "-u"
